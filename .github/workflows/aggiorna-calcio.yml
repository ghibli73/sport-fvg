name: Aggiorna calcio

on:
  schedule:
    # i comunicati LND escono soprattutto tra lunedì e giovedì (orari UTC)
    - cron: "23 13,18 * * 1-5"
    - cron: "23 19 * * 6,0"
  workflow_dispatch:
    inputs:
      opzioni:
        description: "Opzioni per scripts/calcio.py (es. --tutto)"
        required: false
        default: ""
      silenzioso:
        description: "Non inviare gli avvisi ntfy dei risultati"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  calcio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cp data/risultati.json /tmp/risultati_prima.json
      - name: Comunicati ufficiali LND FVG
        run: python scripts/calcio.py ${{ github.event.inputs.opzioni }}
      - name: Controlli prima di pubblicare
        run: python scripts/risultati_tools.py check /tmp/risultati_prima.json data/risultati.json
      - name: Avvisi dei risultati (ntfy.sh)
        run: python scripts/avvisi.py /tmp/risultati_prima.json data/risultati.json
        continue-on-error: true
        env:
          SILENZIOSO: ${{ github.event.inputs.silenzioso }}
      - name: Calendari delle società (data/ics)
        run: python scripts/ics.py
        continue-on-error: true
      - name: Salva i dati aggiornati
        run: |
          if [ -z "$(git status --porcelain data/ config/)" ]; then echo "Nessuna novità"; exit 0; fi
          git config user.name "sport-fvg-bot"
          git config user.email "sport-fvg-bot@users.noreply.github.com"
          git add data/ config/
          git commit -m "Calcio: aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
