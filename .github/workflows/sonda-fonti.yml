name: Sonda fonti (solo lettura)
on:
  workflow_dispatch:
    inputs:
      prove:
        description: "basket calcio minori (separati da spazio)"
        required: false
        default: "basket calcio minori"
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pdfplumber
      - run: python scripts/sonde/sonda_fonti.py ${{ github.event.inputs.prove }}
