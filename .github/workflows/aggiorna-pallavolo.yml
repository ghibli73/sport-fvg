name: Aggiorna pallavolo

on:
  schedule:
    # orari in UTC (Italia = UTC+1 d'inverno, UTC+2 d'estate)
    - cron: "17 13-22 * * 6,0"   # sabato e domenica: ogni ora dalle 14 alle 23 circa
    - cron: "37 20 * * 1-5"      # dal lunedì al venerdì: una volta, verso le 21
  workflow_dispatch:              # avvio manuale dal pulsante "Run workflow"

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  pallavolo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Copia dei dati attuali
        run: cp data/risultati.json /tmp/risultati_prima.json
      - name: Legge classifiche e risultati dai portali FIPAV
        run: python scripts/volley.py
      - name: Controlli prima di pubblicare
        run: python scripts/risultati_tools.py check /tmp/risultati_prima.json data/risultati.json
      - name: Salva i dati aggiornati
        run: |
          if git diff --quiet data/; then echo "Nessuna novità"; exit 0; fi
          git config user.name "sport-fvg-bot"
          git config user.email "sport-fvg-bot@users.noreply.github.com"
          git add data/
          git commit -m "Pallavolo: aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
