name: Aggiorna basket

on:
  schedule:
    # le omologazioni FIP escono di solito tra martedì e venerdì pomeriggio (orari UTC)
    - cron: "41 14,17 * * 2-5"
    - cron: "41 19 * * 6,0,1"
  workflow_dispatch:
    inputs:
      opzioni:
        description: "Opzioni per scripts/basket.py (es. --tutto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  basket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cp data/risultati.json /tmp/risultati_prima.json
      - name: Calendari e omologazioni FIP
        run: python scripts/basket.py ${{ github.event.inputs.opzioni }}
      - name: Controlli prima di pubblicare
        run: python scripts/risultati_tools.py check /tmp/risultati_prima.json data/risultati.json
      - name: Salva i dati aggiornati
        run: |
          if git diff --quiet data/ config/; then echo "Nessuna novità"; exit 0; fi
          git config user.name "sport-fvg-bot"
          git config user.email "sport-fvg-bot@users.noreply.github.com"
          git add data/ config/
          git commit -m "Basket: aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
