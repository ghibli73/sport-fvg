name: Aggiorna basket

on:
  schedule:
    # le omologazioni FIP escono di solito tra martedì e venerdì pomeriggio (orari UTC)
    - cron: "41 14,17 * * 2-5"
    - cron: "41 19 * * 6,0,1"
    - cron: "53 1 * * *"         # ogni notte verso le 3: date, ore e campi di tutte le giornate future (portale FIP)
  workflow_dispatch:
    inputs:
      opzioni:
        description: "Opzioni per scripts/basket.py (es. --tutto, --completo, --scopri-fip, --prova)"
        required: false
        default: ""
      silenzioso:
        description: "Non inviare gli avvisi ntfy (risultati e partite spostate)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# un gruppo per sport: pallavolo, basket, calcio e giro rapido non si annullano più a vicenda (prima un unico gruppo
# "aggiorna-dati" faceva annullare le esecuzioni in coda); se due salvano insieme, scripts/salva_dati.sh unisce i gironi
concurrency:
  group: aggiorna-basket
  cancel-in-progress: false

env:
  # opzioni del lancio manuale (--prova: nessun file del repository viene modificato, nessun commit,
  # gli avvisi sono solo stampati; il risultato è in /tmp/risultati_prova.json)
  OPZIONI: ${{ github.event.inputs.opzioni }}
  NOTTE: ${{ github.event.schedule == '53 1 * * *' }}

jobs:
  basket:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copia dei dati attuali
        run: |
          cp data/risultati.json /tmp/risultati_prima.json
          OUT=data/risultati.json; PROVA=false
          case " $OPZIONI " in *" --prova "*) OUT=/tmp/risultati_prova.json; PROVA=true;; esac
          echo "OUT=$OUT" >> "$GITHUB_ENV"; echo "PROVA=$PROVA" >> "$GITHUB_ENV"
      - name: Calendari, variazioni (portale FIP) e omologazioni FIP
        run: |
          EXTRA=""; if [ "$NOTTE" = "true" ]; then EXTRA="--completo"; fi
          python scripts/basket.py $OPZIONI $EXTRA
      - name: Partite spostate (campo "variata") e rapporto
        run: python scripts/variazioni.py /tmp/risultati_prima.json "$OUT"
      - name: Controlli prima di pubblicare
        run: python scripts/risultati_tools.py check /tmp/risultati_prima.json "$OUT"
      - name: Avvisi dei risultati e delle partite spostate (ntfy.sh)
        run: |
          if [ "$PROVA" = "true" ]; then python scripts/avvisi.py /tmp/risultati_prima.json "$OUT" --prova
          else python scripts/avvisi.py /tmp/risultati_prima.json "$OUT"; fi
        continue-on-error: true
        env:
          SILENZIOSO: ${{ github.event.inputs.silenzioso }}
      - name: Calendari delle società (data/ics) e widget (data/widget), solo se i dati sono cambiati
        if: env.PROVA != 'true'
        run: |
          if cmp -s /tmp/risultati_prima.json data/risultati.json; then echo "dati invariati: ics e widget non rigenerati"; exit 0; fi
          python scripts/ics.py || true
          python scripts/widget_dati.py || true
      - name: Salva i dati aggiornati (nessun commit se non ci sono novità; push con unione per girone)
        if: env.PROVA != 'true'
        run: |
          bash scripts/salva_dati.sh "Basket: aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M') UTC" "basket" data/ config/
