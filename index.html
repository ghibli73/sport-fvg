<style>
/* VOICE: guida sportiva regionale da tasca, diretta e veloce
   IDEA: la bacheca dei campionati con i colori della bandiera FVG, tenuta in una mano
   PICTURE: l'elenco dei comuni stesso, ogni riga con le icone degli sport presenti
   COLOUR and TYPE: blu regione profondo, oro aquila, bianco; font di sistema (system-ui) con titoli condensati se disponibili
   LAYOUT: barra blu fissa con ricerca, filtri in una riga, liste compatte, barra schede in basso, scheda società a tutto schermo */
:root{color-scheme:light dark;
--bg:light-dark(#eef2f8,#0a1322);--card:light-dark(#fff,#121e34);--ink:light-dark(#0f1c33,#e8eef8);--mute:light-dark(#5a6780,#9fb0c9);
--blue:#123a6b;--blue2:#0c2b52;--gold:#f2b705;--chalk:#f5f7fb;--line:light-dark(#dde3ee,#22324f);--soft:light-dark(#e8eef8,#1a2a47);
--acc:light-dark(#123a6b,#f2b705);--f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fc:"Roboto Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;padding-bottom:calc(72px + var(--safe-b))}
h1,h2,h3{font-family:var(--fc);line-height:1.08;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* barra in alto */
.top{position:sticky;top:0;z-index:20;background:var(--blue);color:var(--chalk);padding:calc(10px + var(--safe-t)) 14px 10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto 8px}
.brand .logo{width:34px;height:34px;border-radius:10px;flex:none;margin:-2px 0}
.brand h1{font-size:27px;font-weight:800;letter-spacing:.2px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand h1 small{font:600 13px var(--f);color:#c9d6ea;letter-spacing:.3px}
.brand .cov{margin-left:auto;font-size:13px;color:#c9d6ea;white-space:nowrap}
.dtabs{display:none;gap:4px;margin-left:16px}
.dtab{border:0;background:transparent;color:#c9d6ea;font:700 17px var(--fc);padding:6px 12px;border-radius:8px;min-height:44px}
.dtab:hover{color:#fff;background:rgba(255,255,255,.08)}
.dtab[aria-current=true]{background:rgba(255,255,255,.14);color:#fff}
.sbox{position:relative;max-width:1100px;margin:0 auto}
.sbox input{width:100%;font:16px var(--f);padding:11px 40px 11px 42px;border-radius:12px;border:0;min-height:46px;background:var(--chalk);color:#0f1c33}
.sbox input::placeholder{color:#5a6780;opacity:1}
.sbox .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#5a6780;pointer-events:none}
.sbox .clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:#5a6780;font-size:22px;display:none}
.sbox.has .clr{display:block}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);max-height:min(62vh,460px);overflow:auto;display:none;padding:6px 0}
.sugg.on{display:block}
.sugg .sgh{margin:8px 14px 4px;font:600 13px var(--f);color:var(--mute);text-transform:none}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 14px;min-height:48px}
.sg:hover,.sg.k{background:var(--soft)}
.sg .i{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--acc);flex:none}
.sg .i svg{width:22px;height:22px}
.sg b{display:block;font-weight:600;line-height:1.2}
.sg small{color:var(--mute);font-size:13px}
/* filtri */
.filt{position:sticky;top:calc(112px + var(--safe-t));z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}
.frow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.frow::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.pill svg{width:20px;height:20px;color:var(--acc)}
.pill[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.pill[aria-pressed=true] svg{color:var(--gold)}
.pill.sp{border-style:dashed}
.pill .x{margin-left:2px;font-size:18px;line-height:1;opacity:.8}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
/* contenuto */
main{max-width:1100px;margin:0 auto;padding:14px 14px 24px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 2px 10px}
.hd h2{font-size:26px;font-weight:800}
.hd .n{color:var(--mute);font-size:14px}
.sort{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px}
.sort button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mute);min-height:44px}
.sort button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;min-height:60px}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
@media(hover:hover){.row:hover{background:var(--soft)}}
.row .t{font-weight:700;font-size:17px;line-height:1.2;display:flex;align-items:center;gap:6px}
.row .t em{font-style:normal;font:600 13px var(--f);color:var(--mute);background:var(--soft);border-radius:6px;padding:1px 6px;flex:none}
.row>span:first-child{min-width:0}
.row .s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--mute);font-size:14px;line-height:1.35;margin-top:3px;overflow:hidden}
.row .s b{color:var(--acc);font-weight:600}
.mini{display:flex;gap:3px;margin-top:5px}
.mini svg{width:20px;height:20px;color:var(--acc)}
.cnt{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;white-space:nowrap}
.cnt b{font:700 20px var(--fc);color:var(--ink)}
.cnt svg{width:18px;height:18px;opacity:.7}
.cnt b.z{color:var(--mute);font-weight:600}
.row.club{grid-template-columns:44px minmax(0,1fr) auto}
.ico{width:44px;height:44px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:var(--gold)}
.ico svg{width:28px;height:28px}
.grp{margin:18px 2px 8px;display:flex;align-items:center;gap:8px;font:700 18px var(--fc)}
.grp svg{width:22px;height:22px;color:var(--acc)}
.grp span{color:var(--mute);font:500 14px var(--f)}
.more{display:block;width:100%;margin:12px 0 0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.emp{text-align:center;padding:24px 18px}.emp p{margin:10px 0 4px;color:var(--mute)}
.emi{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--gold)}.emi svg{width:32px;height:32px;fill:var(--gold)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--acc);font-weight:600;padding:6px 10px 6px 2px;min-height:44px;margin:-6px 0 4px}
.back svg{width:20px;height:20px}
.chead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.chead h2{font-size:30px;font-weight:800;text-wrap:balance}
@media(max-width:479px){.chead h2{font-size:27px}}
.chead p{margin:4px 0 0;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
@media(max-width:759px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px 2px}.chips::-webkit-scrollbar{display:none}.cp{flex:none}}
.cp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 9px;font-size:14px;font-weight:600;min-height:44px}
.cp svg{width:18px;height:18px;color:var(--acc)}
.cp[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.cp[aria-pressed=true] svg{color:var(--gold)}
/* griglia sport */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-align:left;min-height:104px}
.stile svg{width:32px;height:32px;color:var(--acc)}
.stile b{font-size:16px;line-height:1.15}
.stile small{color:var(--mute)}
.stile[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
/* info */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:20px;margin-bottom:8px}
.big{font:800 44px/1 var(--fc);color:var(--acc)}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--gold)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:22px 8.5em minmax(0,1fr) 3em;align-items:center;gap:8px;font-size:14px}
.bar svg{width:20px;height:20px;color:var(--acc)}
.bar i{display:block;height:8px;border-radius:9px;background:var(--blue)}
:root[data-theme=dark] .bar i{background:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bar i{background:var(--gold)}}
.bar span:last-child{text-align:right;color:var(--mute)}
.small{font-size:14px;color:var(--mute)}
/* barra in basso */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + var(--safe-b))}
.nb{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mute);min-height:56px;justify-content:center;border-radius:10px}
.nb svg{width:52px;height:30px;padding:3px 14px;border-radius:999px;transition:background .15s}
.nb[aria-current=true]{color:var(--acc)}
.nb[aria-current=true] svg{background:var(--soft)}
.nb:active svg{background:var(--soft)}
/* scheda società */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,12,25,.5);display:none}
.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--bg);overflow:auto;overscroll-behavior:contain;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.ph{position:sticky;top:0;z-index:2;background:var(--blue);color:#fff;padding:calc(8px + var(--safe-t)) 8px 14px;display:grid;grid-template-columns:44px 52px minmax(0,1fr) 44px;gap:10px;align-items:center}
.ph .bk{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.ph .bk svg{width:22px;height:22px}
.ph .ico{background:var(--gold);color:var(--blue);width:52px;height:52px}
.panel:focus{outline:none}
.ph h2{font-size:23px;font-weight:800;text-wrap:balance}
@media(max-width:479px){.ph h2{font-size:21px}}
.ph p{margin:2px 0 0;color:#c9d6ea;font-size:14px}
.pb{max-width:760px;margin:0 auto;padding:14px 14px calc(28px + var(--safe-b))}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;color:var(--ink)}
.act svg{width:20px;height:20px;color:var(--acc)}
.act.facebook svg{color:#1877f2}.act.instagram svg{color:#d62976}
.now{background:var(--blue);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.now small{color:#c9d6ea;font-size:13px}
.now b{display:block;font:700 22px var(--fc);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--soft)}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tli:first-child{border-top:0}
.tli .y{font:700 16px var(--fc);color:var(--mute)}
.tli .c{font-size:15px;line-height:1.3}
.pos{display:inline-block;min-width:40px;max-width:11em;text-align:center;font:700 16px var(--fc);padding:3px 8px;border-radius:8px;background:var(--soft);overflow-wrap:anywhere}
.pos.up{background:#d6f5df;color:#0b5a2b}.pos.dn{background:#fde0d6;color:#8a2a0a}.pos.nd{color:var(--mute);font-weight:600}
.tli.sq{grid-template-columns:7.5em minmax(0,1fr)}
.cl{width:100%;border-collapse:collapse;font-size:15px}
.card:has(>.cl){padding:6px 10px 10px}
.cl th{font:600 13px var(--f);color:var(--mute);text-align:right;padding:10px 4px 6px;border-bottom:1px solid var(--line)}
.cl th:nth-child(2){text-align:left}
.cl td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cl td.sq{text-align:left;white-space:normal;font-weight:600;line-height:1.25;overflow-wrap:break-word;font-size:14px;padding-left:6px}
.cl tbody tr:last-child td{border-bottom:0}
.cl td.pt{color:var(--ink)}
.cl tbody tr:nth-child(-n+3) td.p{color:var(--acc)}
.cl td.p{font:700 17px var(--fc);color:var(--mute);width:1.8em;text-align:center}
.cl td.pt{font:800 18px var(--fc);padding-right:8px}
.cl tr.me td{background:var(--soft)}
.cl tr[data-id]{cursor:pointer}
.cl td.sq a{color:var(--acc);text-decoration:none}
@media(max-width:420px){.cl .hx{display:none}}
.mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mt:first-child{border-top:0}
.mt .h{text-align:right;font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:break-word;hyphens:auto}.dh{font:700 15px var(--fc);color:var(--mute);margin:8px 0 0;padding-top:6px}
.dh+.mt{border-top:0}
.mt+.dh{border-top:1px solid var(--line);margin-top:0;padding-top:12px}.mt .a{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:break-word;hyphens:auto}
.mt .r{font:800 20px var(--fc);background:var(--soft);border-radius:8px;padding:4px 8px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.mt .r.fut{font:600 14px/1.2 var(--f);color:var(--ink);background:none;min-width:48px}
.mt .r.fut i{display:block;font-style:normal;color:var(--mute);font-size:13px}
.mt small{grid-column:1/-1;text-align:center;color:var(--mute);font-size:13px;margin:-10px 0 -8px}
.ptag{display:inline-block;font-size:10.5px;font-weight:700;line-height:15px;padding:0 6px;border-radius:8px;background:light-dark(#e8eefc,#1c2a44);color:light-dark(#1d4f8f,#9cc0ff);margin:0 0 0 4px;white-space:nowrap;vertical-align:1px}.r .ptag{display:block;margin:2px auto 0;width:max-content}.aggt{font-size:12px;color:var(--mut,#5b6577);font-weight:600}.tka{font-size:11px;font-weight:600;color:#cfe0ff;margin-left:6px;white-space:nowrap}
.vtag{display:inline-block;font-size:11px;font-weight:700;line-height:16px;padding:1px 7px;border-radius:9px;background:light-dark(#fff1cc,#3a2e05);color:light-dark(#7a4a00,#f2b705);margin:0 2px;white-space:nowrap;vertical-align:1px}.r .vtag{display:block;margin:3px auto 0;width:max-content}
.mt .me{color:var(--acc)}
.mt .sqa{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.gc{display:block;font:400 12px/1.3 var(--f);color:var(--mute);margin-top:2px}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-top:1px solid var(--line)}
.rr:first-child{border-top:0}
.rr b{font-size:15px;line-height:1.25}.rr small{color:var(--mute);font-size:13px;grid-column:1}
.rr .ps{grid-row:1/3;grid-column:2;text-align:right;font:800 24px var(--fc);color:var(--acc)}
.rr .ps span{display:block;font:600 13px var(--f);color:var(--mute)}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px}
@media(min-width:760px){.ib{display:none}}
.star{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.star svg{width:24px;height:24px}
.star[aria-pressed=true]{color:var(--gold)}.star[aria-pressed=true] svg{fill:var(--gold)}
.gstar{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:44px;margin-top:10px}
.gstar svg{width:18px;height:18px;color:var(--acc)}
.gstar[aria-pressed=true] svg{fill:var(--gold);color:var(--gold)}
.row .fav{width:16px;height:16px;color:var(--gold);fill:var(--gold);flex:none}
.fh{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font:700 18px var(--fc)}
.sync{font-size:13px;color:var(--mute);margin:-4px 2px 10px}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:9px;padding:8px 12px;font-weight:600;font-size:15px;color:var(--mute);min-height:44px;white-space:nowrap}
.seg button svg{width:20px;height:20px}

@media(hover:hover) and (pointer:fine){.spa{display:grid;place-items:center;position:absolute;top:50%;left:-6px;transform:translateY(-60%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}.spa.r{left:auto;right:-6px}.spa svg{width:20px;height:20px}}

/* animazioni d'ingresso (< 400 ms), mai con "riduci movimento" */
@media(prefers-reduced-motion:no-preference){
 .hp .wp{animation:whin .26s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*20ms)}
 .hp .wb{animation:whfade .18s ease-out both;animation-delay:calc(150ms + var(--i)*20ms)}
 .hp .spc2{animation:spin .22s ease-out both;animation-delay:calc(var(--i)*35ms)}
 .spr{scroll-behavior:smooth}
}
@keyframes whin{from{transform:rotate(-60deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes whfade{from{opacity:0}to{opacity:1}}
@keyframes spin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

const v=norm($('q').value.trim());$('sbox').classList.toggle('has',!!v);const s=$('sugg');
if(v.length<2){s.classList.remove('on');$('q').setAttribute('aria-expanded','false');return}
const tk=v.split(/\s+/).filter(Boolean);const cm=COM.filter(c=>tk.every(t=>norm(c.nome).includes(t))).sort((a,b)=>norm(a.nome).indexOf(v)-norm(b.nome).indexOf(v)||a.nome.localeCompare(b.nome)).slice(0,5);
const cl=C.filter(c=>{const h=norm(c.nome+' '+c.comune+' '+(NAMES[c.sport]||''));return tk.every(t=>h.includes(t))}).sort((a,b)=>(norm(b.nome).includes(v)?1:0)-(norm(a.nome).includes(v)?1:0)).slice(0,8);
s.innerHTML=(cm.length?'<div role="group" aria-label="Comuni"><div class="sgh" aria-hidden="true">Comuni</div>'+cm.map((c,i)=>`<button class="sg" role="option" id="sgc${i}" data-c="${c.codice}"><span class="i">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/></svg>'}</span><span><b>${esc(c.nome)}</b><small>${PROV[c.prov]} · ${(BYC[c.codice]||[]).length} società</small></span></button>`).join('')+'</div>':'')+
(cl.length?'<div role="group" aria-label="Società"><div class="sgh" aria-hidden="true">Società</div>'+cl.map((c,i)=>`<button class="sg" role="option" id="sgs${i}" data-id="${c.id}"><span class="i">${ico(c.sport)}</span><span><b>${esc(c.nome)}</b><small>${esc(NAMES[c.sport])} · ${esc(c.comune)}</small></span></button>`).join('')+'</div>':'')||`<div class="empty" role="option" aria-disabled="true">Nessun comune o società per «${esc($('q').value.trim())}». Prova con il nome del paese o una parte del nome della società.</div>`;
s.classList.add('on');$('q').setAttribute('aria-expanded','true');$('q').removeAttribute('aria-activedescendant');sel=-1;
}
function hideSugg(){$('sugg').classList.remove('on');$('q').setAttribute('aria-expanded','false');$('q').removeAttribute('aria-activedescendant')}
$('q').addEventListener('input',suggest);
$('q').addEventListener('focus',suggest);
$('q').addEventListener('keydown',e=>{const o=[...$('sugg').querySelectorAll('.sg')];if(!o.length)return;
if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+o.length)%o.length;o.forEach((x,i)=>{x.classList.toggle('k',i===sel);x.setAttribute('aria-selected',i===sel)});$('q').setAttribute('aria-activedescendant',o[sel].id);o[sel].scrollIntoView({block:'nearest'})}
else if(e.key==='Enter'){(o[sel]||o[0]).click()}else if(e.key==='Escape'){hideSugg();$('q').blur()}});
$('clr').addEventListener('click',()=>{$('q').value='';suggest();$('q').focus()});

});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('sheet').classList.contains('on'))history.back();else if(!$('inst').hidden){e.preventDefault();instClose(true)}});

document.documentElement.dataset.home=HOME||'classica';if(HOME){const nb=document.querySelector('.nb[data-v=comuni]'),dtb=document.querySelector('.dtab[data-v=comuni]');if(nb)nb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home';if(dtb)dtb.textContent='Home';intro()}
/* ===== 1.13.1 tempo reale (pipeline/agenti/tempo-reale.md): con l'app aperta e visibile controlla data/stato.json ogni
   3 minuti nelle fasce di gara (sab 15-23:30, dom 15-21:30, lun-ven 20-23:30, ora italiana) e ogni 15 fuori; al ritorno in
   primo piano dopo più di 2 minuti subito. data/risultati.json (2,4 MB) si riscarica solo se l'impronta è cambiata. ===== */
let AGGT='',RVER='',RLAST=Date.now(),RHID=0,RBUSY=false,RPEND=false;
const provTag=x=>x&&x.risultato&&(x.non_omologato||x.provvisorio)?`<span class="ptag" title="${x.non_omologato?'Punteggio del portale FIP, in attesa dell’omologazione del Giudice sportivo':'Risultato del Quadro gare LND, in attesa del Comunicato Ufficiale'}">${x.non_omologato?'da omologare':'provvisorio'}</span>`:'';
const romaOra=()=>{try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=k=>(p.find(x=>x.type===k)||{}).value;return{w:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(v('weekday')),m:+v('hour')*60+ +v('minute')}}catch(e){const d=new Date();return{w:d.getDay(),m:d.getHours()*60+d.getMinutes()}}};
const inFascia=()=>{const{w,m}=romaOra();return w===6?m>=900&&m<=1410:w===0?m>=900&&m<=1290:m>=1200&&m<=1410};
function aggTesto(){const d=new Date(AGGT);if(!AGGT||isNaN(d))return'';const o={timeZone:'Europe/Rome'},hh=d.toLocaleTimeString('it-IT',{...o,hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('it-IT',o)===new Date().toLocaleDateString('it-IT',o)?`Aggiornato alle ${hh}`:`Aggiornato il ${d.toLocaleDateString('it-IT',{...o,day:'numeric',month:'numeric'})} alle ${hh}`}
const aggBreve=()=>{const t=aggTesto();return t.replace(/^Aggiornato (alle |il )/,'').replace(' alle ',' ')};
const aggSegna=()=>{document.querySelectorAll('[data-aggt]').forEach(e=>e.textContent=aggTesto());document.querySelectorAll('[data-aggb]').forEach(e=>{e.title=aggTesto();e.innerHTML=`<span class="vh">${esc(aggTesto())}</span><span aria-hidden="true">${esc(aggBreve())}</span>`})};
const firmaG=L=>JSON.stringify(L.map(g=>[g.gid,g.aggiornato,(g.partite||[]).filter(p=>p.risultato).length]));
const statoRis=()=>fetch('data/stato.json?t='+Math.floor(Date.now()/60000),{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);
function ridisegna(){const ae=document.activeElement;if($('sheet').classList.contains('on')||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))){RPEND=true;return}RPEND=false;
const A=['data-g','data-gg','data-go','data-rs','data-ra','data-day','data-fid','data-pick'],sel=ae&&ae!==document.body&&ae.getAttribute?A.filter(a=>ae.getAttribute(a)!=null).map(a=>`[${a}="${CSS.escape(ae.getAttribute(a))}"]`).join(''):'';
const y=window.scrollY;render();window.scrollTo(0,y);if(sel){const e=document.querySelector(sel);if(e)e.focus({preventScroll:true})}}
async function ricarica(){if(RBUSY||!G.length)return;RBUSY=true;RLAST=Date.now();try{const s=await statoRis();let rg=null;
if(s&&s.versione){if(s.versione!==RVER)rg=await fetch('data/risultati.json?v='+encodeURIComponent(s.versione),{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);if(rg||s.versione===RVER){RVER=s.versione;AGGT=s.aggiornato||AGGT}}
else{rg=await fetch('data/risultati.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null);if(rg){const f=firmaG(rg);if(f===RVER)rg=null;else RVER=f}}
if(Array.isArray(rg)&&rg.length){G=rg;GBY={};G.forEach(g=>GBY[g.gid]=g);ridisegna()}else if(RPEND)ridisegna();else aggSegna()}finally{RBUSY=false}}
setInterval(()=>{if(document.visibilityState!=='visible')return;if(Date.now()-RLAST>=(inFascia()?3:15)*60000-5000)ricarica();else if(RPEND)ridisegna()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')RHID=Date.now();else if(RHID&&Date.now()-RHID>120000){RHID=0;ricarica()}});
favLoad();favCloud();logoLoad();prov=st.get('prov')||'';sortBy=st.get('sort')||'az';if(!PROV[prov])prov='';
Promise.all([fetch('data/comuni.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/data.json',{cache:'no-cache'}).then(r=>r.json()),fetch('data/risultati.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]),fetch('data/agenda.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([c,d,rg,ag])=>{
AG=(Array.isArray(ag)?ag:[]).filter(e=>e&&e.id&&/^\d{4}-\d\d-\d\d$/.test(e.data||'')).sort((a,b)=>a.data.localeCompare(b.data)||String(a.ora||'').localeCompare(String(b.ora||''))||a.titolo.localeCompare(b.titolo));AG.forEach(e=>AGBY[e.id]=e);
G=rg||[];G.forEach(g=>GBY[g.gid]=g);$('main').removeAttribute('aria-busy');RVER=firmaG(G);statoRis().then(s=>{if(s&&s.versione){RVER=s.versione;AGGT=s.aggiornato||'';aggSegna();if(AGGT&&!document.querySelector('[data-aggt],[data-aggb]')&&(view==='risultati'||(HOME&&!girone&&!comune&&view==='comuni')))ridisegna()}});
COM=c.comuni;AGG=c.aggiornato;C=d;const OLD={};C.forEach(k=>(k.id_vecchi||[]).forEach(o=>OLD[o]=k.id));if(FAV.c.some(i=>OLD[i])){FAV.c=[...new Set(FAV.c.map(i=>OLD[i]||i))];favSave()}if(location.hash.startsWith('#s-')&&OLD[location.hash.slice(3)])history.replaceState(null,'','#s-'+OLD[location.hash.slice(3)]);C.forEach(k=>(BYC[k.codice]=BYC[k.codice]||[]).push(k));
$('cov').textContent=`${C.length} società · 215 comuni`;
const h=location.hash.slice(1);if(h.startsWith('s-')){const id=h.slice(2);history.replaceState(null,'','#comuni');route();openClub(id)}else if(h.startsWith('e-')&&AGBY[h.slice(2)]){const id=h.slice(2);history.replaceState(null,'','#agenda');route();openEvent(id)}else route();
}).catch(()=>{$('main').removeAttribute('aria-busy');$('main').innerHTML=`<div class="err" role="alert">${navigator.onLine===false?'Sei senza connessione e i dati non sono ancora salvati su questo dispositivo. Riprova quando torni in linea.':'Non riesco a caricare i dati. Riprova tra qualche istante.'}</div><button class="more" onclick="location.reload()">Riprova</button>`});
}
